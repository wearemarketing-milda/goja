# GOJA klinikos turinio valdymas (Sveltia CMS). Kiekvienas išsaugojimas = commit GitHub'e, Vercel publikuoja per ~1 min.
backend:
  name: github
  repo: wearemarketing-milda/goja
  branch: main
  base_url: https://gojaklinika.lt
  auth_endpoint: api/auth
  commit_messages:
    create: 'CMS: sukurta – {{collection}} / {{slug}}'
    update: 'CMS: atnaujinta – {{collection}} / {{slug}}'
    delete: 'CMS: ištrinta – {{collection}} / {{slug}}'
    uploadMedia: 'CMS: įkelta nuotrauka {{path}}'
    deleteMedia: 'CMS: ištrinta nuotrauka {{path}}'
site_url: https://gojaklinika.lt
display_url: https://gojaklinika.lt
logo_url: /assets/brand-horizontal-blue.png
media_folder: assets/uploads
public_folder: /assets/uploads
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: pages
  label: Puslapiai
  label_singular: Puslapis
  description: Visi svetainės puslapiai. Paslaugų puslapiai yra „Paslaugos“ dukteriniai puslapiai (laukas „Tėvinis puslapis“).
  folder: content/pages
  format: json
  extension: json
  create: true
  delete: true
  identifier_field: nav_label
  slug: '{{fields.slug}}'
  summary: '{{nav_label}} — /{{slug}}'
  sortable_fields:
  - menu_order
  - nav_label
  - parent
  view_groups:
  - label: Tėvinis puslapis
    field: parent
  preview_path: /{{slug}}
  fields:
  - label: Pavadinimas
    name: title
    widget: string
    hint: Pagrindinis puslapio pavadinimas (naudojamas struktūriniuose duomenyse). Matoma H1 antraštė redaguojama pirmajame bloke.
  - label: Trumpas pavadinimas
    name: nav_label
    widget: string
    hint: Rodomas kelio juostoje (breadcrumbs), meniu ir paslaugų kortelėse.
  - label: Nuoroda (slug)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Tik mažosios raidės be lietuviškų raidžių, skaičiai ir brūkšneliai
    hint: 'Puslapio adresas: gojaklinika.lt/<slug>. Pradžios puslapio slug yra „index“. Pakeitę slug, sukurkite redirect''ą iš senojo adreso.'
  - label: Publikuotas
    name: published
    widget: boolean
    default: true
    required: false
    hint: Išjungus, puslapis nebus generuojamas (juodraštis).
  - label: Tėvinis puslapis
    name: parent
    widget: relation
    collection: pages
    value_field: slug
    search_fields:
    - nav_label
    - title
    display_fields:
    - nav_label
    required: false
    hint: Pvz. paslaugų puslapiams – „Paslaugos“. Nuo to priklauso kelio juosta, submeniu ir paslaugų kortelės.
  - label: Rodyti meniu
    name: show_in_menu
    widget: boolean
    default: false
    required: false
  - label: Eilės numeris meniu
    name: menu_order
    widget: number
    value_type: int
    default: 100
    required: false
    hint: Mažesnis skaičius – arčiau pradžios.
  - label: Kitoks tekstas meniu
    name: menu_label
    widget: string
    required: false
    hint: Jei meniu turi būti kitas tekstas nei „Trumpas pavadinimas“.
  - label: 'SEO: Meta title'
    name: meta_title
    widget: string
    hint: Rekomenduojama iki 60 simbolių.
  - label: 'SEO: Meta description'
    name: meta_description
    widget: text
    hint: Rekomenduojama 120–155 simboliai.
  - label: 'SEO: Socialinių tinklų nuotrauka'
    name: og_image
    widget: image
    required: false
    choose_url: true
    hint: Jei tuščia – naudojama bendra nuotrauka iš Nustatymų.
  - label: 'SEO: Neindeksuoti (noindex)'
    name: noindex
    widget: boolean
    default: false
    required: false
  - label: 'SEO: Įtraukti į sitemap.xml'
    name: sitemap
    widget: boolean
    default: true
    required: false
  - label: 'Kortelė: pavadinimas'
    name: card_title
    widget: string
    required: false
    hint: 'Dukteriniams puslapiams: rodoma tėvinio puslapio kortelių sąraše (pvz. paslaugų kortelės). Jei tuščia – naudojamas „Trumpas pavadinimas“.'
  - label: 'Kortelė: aprašymas'
    name: card_text
    widget: text
    required: false
    hint: Rodomas paslaugų kortelėse ir „Paslaugos“ mega meniu po pavadinimu.
  - widget: object
    collapsed: false
    required: false
    fields:
    - label: Nuotrauka
      name: src
      widget: image
      required: false
      choose_url: true
    - label: Alternatyvus tekstas (alt)
      name: alt
      widget: string
      required: false
      hint: Trumpai aprašykite, kas nuotraukoje (svarbu SEO ir prieinamumui).
    label: 'Kortelė: nuotrauka'
    name: card_image
  - label: 'Kortelė: nuotrauka neapkarpoma'
    name: card_uncropped
    widget: boolean
    default: false
    required: false
    hint: Įjunkite iliustracijoms, kurios turi matytis visos.
  - label: Turinio blokai
    name: blocks
    widget: list
    typeKey: type
    collapsed: true
    add_to_top: false
    hint: Puslapio sekcijos iš viršaus į apačią. Galima pridėti, perrikiuoti ir ištrinti.
    types:
    - label: Kontaktų sekcija (bendra – redaguojama Nustatymuose)
      name: global_contact
      fields:
      - label: Paslėpti bloką
        name: hidden
        widget: boolean
        default: false
        required: false
        hint: Įjungus, blokas lieka išsaugotas, bet svetainėje nerodomas.
    - label: Pradžios puslapio viršus (hero su video)
      name: hero
      summary: '{{fields.title}}'
      fields:
      - label: Paslėpti bloką
