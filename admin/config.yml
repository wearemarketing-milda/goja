- name: specialistai
  label: Specialistai
  label_singular: Specialistas
  folder: content/specialistai
  format: json
  extension: json
  create: true
  delete: true
  identifier_field: name
  slug: '{{fields.slug}}'
  summary: '{{name}} — {{card_role}}'
  sortable_fields:
  - order
  - name
  fields:
  - label: Vardas ir pavardė
    name: name
    widget: string
  - label: Nuoroda (slug)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Tik mažosios raidės be lietuviškų raidžių, skaičiai ir brūkšneliai
    hint: Pvz. tomas-janeliunas. Naudojama kaip sekcijos inkaras (#tomas-janeliunas).
  - label: Publikuotas
    name: published
    widget: boolean
    default: true
    required: false
  - label: Atskiras profilio puslapis
    name: landing_page
    widget: boolean
    default: true
    required: false
    hint: Sukuria puslapį gojaklinika.lt/specialistai/<slug>, randamą paieškos sistemose, ir drawer'į paspaudus kortelę.
  - label: Rodyti komandoje
    name: show_in_team
    widget: boolean
    default: true
    required: false
  - label: Eilės numeris
    name: order
    widget: number
    value_type: int
    default: 100
  - label: Nuotrauka
    name: photo
    widget: image
    choose_url: true
  - label: Nuotraukos alt (komandos kortelė)
    name: photo_alt
    widget: string
    required: false
  - label: Pareigos kortelėje
    name: card_role
    widget: string
    hint: Pvz. Gyd. burnos chirurgas – ortopedas
  - label: Pareigos prisistatyme
    name: role
    widget: string
    required: false
    hint: Pvz. Burnos chirurgas · Gydytojas odontologas ortopedas
  - label: Pareigos struktūriniams duomenims
    name: job_title
    widget: string
    required: false
    hint: Pvz. Burnos chirurgas, gydytojas odontologas ortopedas
  - label: Nuotraukos alt (prisistatymas)
    name: portrait_alt
    widget: string
    required: false
  - label: Virš vardo (mažos raidės)
    name: eyebrow
    widget: string
    required: false
  - label: Aprašymas
    name: bio
    widget: markdown
    required: false
    buttons:
    - bold
    - italic
    - link
    - bulleted-list
    editor_components: []
    minimal: true
  - label: Išsilavinimas ir kvalifikacija
    name: education
    widget: list
    required: false
    summary: '{{fields.year}} – {{fields.text}}'
    fields:
    - label: Metai
      name: year
      widget: string
      hint: Pvz. 2010 m.
    - label: Kvalifikacija
      name: text
      widget: string
  - label: Teikiamos paslaugos
    name: services
    widget: relation
    collection: pages
    value_field: slug
    search_fields:
    - nav_label
    - title
    display_fields:
    - nav_label
