      - label: Virš antraštės (mažos raidės)
        name: eyebrow
        widget: string
        required: false
      - label: Antraštė (H1)
        name: title
        widget: string
      - label: Įžanga
        name: intro
        widget: text
        required: false
      - widget: object
        collapsed: false
        required: false
        fields:
        - label: Tekstas
          name: text
          widget: string
          required: false
        - label: Nuoroda
          name: url
          widget: string
          required: false
          hint: Pvz. /kontaktai, /registracija?paslauga=burnos-higiena, tel:+37061180077, https://...
        label: Mygtukas
        name: button
      - widget: object
        collapsed: false
        required: false
        fields:
        - label: Tekstas
          name: text
          widget: string
          required: false
        - label: Nuoroda
          name: url
          widget: string
          required: false
          hint: Pvz. /kontaktai, /registracija?paslauga=burnos-higiena, tel:+37061180077, https://...
        label: Antras mygtukas (pvz. telefonas)
        name: phone
      - label: Fono video – kompiuteriui (horizontalus MP4)
        name: video
        widget: file
        required: false
        choose_url: true
        hint: 'Rekomenduojama: MP4 (H.264), 1920×1080, be garso, iki ~5 MB, 10–20 s.'
      - label: Fono video – telefonui (vertikalus MP4)
